[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc"
version = "0.1.0"
description = "AI Research Center — 코스닥 미커버 종목 실적 리뷰 노트 자동 생성 시스템 (세미오토)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx",
    "pydantic>=2",
    "duckdb",
    "pyarrow",
    "jinja2",
    "python-dotenv",
    "typer>=0.12",
]

[project.scripts]
arc = "arc.cli:app"

[project.optional-dependencies]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Typer는 기본값으로 typer.Option()을 받는 것이 정상 사용법이다 — B008은 오탐.
"src/arc/cli.py" = ["B008"]
# DART·금융위 응답의 날짜는 YYYYMMDD 문자열이라 타임존이 없다. 날짜(date)로만
# 쓰고 시각 계산에 넣지 않으므로 DTZ007은 여기서 의미가 없다.
"src/arc/data/kr/dart.py" = ["DTZ007"]
"src/arc/data/kr/krx_price.py" = ["DTZ007"]
# 테스트의 클래스 변수는 픽스처 목록이라 변경되지 않는다.
"tests/*" = ["RUF012"]
