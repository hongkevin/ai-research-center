[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arc"
version = "0.1.0"
description = "AI Research Center — 코스닥 미커버 종목 실적 리뷰 노트 자동 생성 시스템 (세미오토)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "httpx",
    "pydantic>=2",
    "duckdb",
    "pyarrow",
    "jinja2",
    "python-dotenv",
    "typer>=0.12",
    "markdown-it-py",
    # 업로드 문서 → 마크다운 (D48). PDF는 실측 200편 추출 실패 0건.
    "pymupdf",
    "python-docx",
    # 엑셀 내보내기 (D56). 모델에 붙여넣으려면 **숫자가 숫자여야** 한다.
    "openpyxl",
]

[project.scripts]
arc = "arc.cli:app"

[project.optional-dependencies]
web = [
    "fastapi",
    "uvicorn[standard]",
    "python-multipart",
    # Supabase 액세스 토큰 검증 (web/auth.py). Next 서버가 없어 브라우저가
    # 토큰을 직접 들고 오므로 API가 스스로 서명을 확인해야 한다.
    #
    # **`crypto` 추가가 필수다.** Supabase는 이제 비대칭 서명키(ES256)가
    # 기본이라 공개키 검증에 `cryptography`가 필요하다(D78). 없으면 PyJWT가
    # `ES256 requires 'cryptography' to be installed`로 죽고, 우리 코드는
    # 그걸 「JWKS를 못 받았다」로 읽어 **모든 토큰을 거부한다** — 로그인은
    # 되는데 화면이 전부 401이 되는, 원인이 안 보이는 형태로.
    "pyjwt[crypto]",
]
db = [
    # 개인 데이터를 Postgres로 (D80). **없어도 돈다** — `DATABASE_URL`이
    # 비어 있으면 파일 저장소로 떨어진다. 테스트와 로컬 개발이 DB를 요구하면
    # 안 된다.
    "psycopg[binary]",
]
telegram = [
    # 텔레그램 수집기 (D66). **선택 의존성이다** — 업로드 경로만 쓰면 필요 없고,
    # 약관 때문에 납품본에는 안 들어간다.
    "telethon",
]
dev = [
    "pytest",
    "respx",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/arc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# Typer는 기본값으로 typer.Option()을 받는 것이 정상 사용법이다 — B008은 오탐.
"src/arc/cli.py" = ["B008"]
# DART·금융위 응답의 날짜는 YYYYMMDD 문자열이라 타임존이 없다. 날짜(date)로만
# 쓰고 시각 계산에 넣지 않으므로 DTZ007은 여기서 의미가 없다.
"src/arc/data/kr/dart.py" = ["DTZ007"]
"src/arc/data/kr/krx_price.py" = ["DTZ007"]
# 테스트의 클래스 변수는 픽스처 목록이라 변경되지 않는다.
"tests/*" = ["RUF012"]
