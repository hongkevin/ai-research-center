# Railway 배포 설정.
#
# 볼륨은 대시보드에서 /data 에 마운트한다 (ARC_STORE_DIR=/data/arc-store).
# 개인 데이터는 이제 Postgres에 있지만(D80) **볼륨은 여전히 필요하다** —
# 시세 2,987종목·corpCode 캐시·텔레그램 원문이 파일이고, 없으면 컨테이너가
# 뜰 때마다 다시 받는다(D69에서 IP가 끊긴 그 종류의 일).
#
# ── 대시보드에 넣을 것 ───────────────────────────────────────────────
#
# **빌드 변수** — Build 탭에 넣는다. 런타임 변수로 넣으면 이미지에 안 온다:
#   NEXT_PUBLIC_SUPABASE_URL        ← 없으면 **빌드가 멈춘다** (의도된 것)
#   NEXT_PUBLIC_SUPABASE_ANON_KEY
#
#   `NEXT_PUBLIC_*`는 빌드 시점에 번들에 박힌다. 런타임에만 넣으면 화면은
#   로그인이 꺼진 줄 알고 토큰을 안 붙이고, 서버는 401을 내고 **앱이 통째로
#   안 열린다** — 서버만 보면 정상으로 보여서 더 나쁘다. 로컬에서 그 일에
#   정확히 물렸다.
#
# **런타임 변수**:
#   DATABASE_URL          Connect → Session pooler (5432)
#   SUPABASE_JWT_SECRET   **비워 둔다** — ES256이라 JWKS로 검증한다 (D78)
#   DART_API_KEY · KRX_API_KEY · ECOS_API_KEY
#   NAVER_CLIENT_ID · NAVER_CLIENT_SECRET
#   ANTHROPIC_API_KEY (또는 OPENAI_API_KEY)
#   TELEGRAM_API_ID · TELEGRAM_API_HASH   (수집기를 쓸 때만)
#   ARC_STORE_DIR=/data/arc-store
#   ARC_ADOPT_LOCAL       **이메일을 적는다** (본인 것). 인증 없이 돌던 동안
#                         `users/local/`에 쌓인 것을 그 사람만 가져간다.
#                         `1`로 두면 먼저 로그인한 사람이 가져가고, 그게
#                         누가 될지는 운이다 (D76 갱신)
#
# 배포 뒤 **한 번**: `arc db init` (스키마 + RLS). 안 돌리면 개인 데이터가
# 조용히 볼륨으로만 간다.

[build]
builder = "dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
# 워커 1개 이유는 Dockerfile 주석 참조 (캐시·예산이 프로세스 메모리에 있다)
numReplicas = 1
