# main 푸시·PR마다 게이트를 돌린다.
#
# 이 저장소의 핵심 자산은 **테스트가 지키는 불변식**이다 — 숫자는 레지스트리를
# 거치고, 검산이 안 맞으면 쓰지 않고, 미검증 레인에는 숫자가 없다. CI가 깨진
# 채로 배포되면 그 보장이 사라진다.
#
# 네트워크가 필요한 테스트는 없다 (전부 픽스처·목킹). API 키도 필요 없다.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: uv 설치
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Python 3.12
        run: uv python install 3.12

      # 러너의 시스템 파이썬은 externally-managed라 --system 설치가 막힌다.
      # 프로젝트 venv를 만들고 uv run으로 그 안에서 돌린다.
      - name: 의존성
        run: |
          uv venv
          uv pip install -e ".[web,dev]"

      - name: 린트
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests

      - name: 테스트
        run: uv run pytest -q

      - name: 커밋에 비밀키가 없는지
        # 실제로 한 번 들어갔던 적이 있다. 사람이 기억하는 대신 CI가 본다.
        run: |
          if git grep -nE 'sk-proj-[A-Za-z0-9_-]{20,}|sk-[A-Za-z0-9]{40,}' -- . ':!*.lock'; then
            echo "::error::커밋에 API 키로 보이는 문자열이 있습니다."
            exit 1
          fi
          echo "비밀키 패턴 없음"

  # 화면. Docker 빌드에도 포함되지만 따로 돌린다 — 타입 오류를 이미지
  # 빌드 10분을 기다린 뒤가 아니라 1분 만에 알게 된다.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 린트
        run: npm run lint
      # `next build`가 타입 검사까지 한다 — 별도 tsc 단계가 필요 없다
      - name: 빌드 (타입 검사 포함)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드 (배포 전에 깨지는지 확인)
        run: docker build -t arc:ci .
      - name: 헬스체크
        run: |
          docker run -d --name arc -p 8000:8000 -e PORT=8000 arc:ci
          for i in $(seq 1 30); do
            if curl -fs http://127.0.0.1:8000/api/health; then echo; break; fi
            sleep 2
            if [ "$i" = "30" ]; then
              echo "::error::헬스체크 실패"; docker logs arc; exit 1
            fi
          done
          # 화면이 이미지 안에 실제로 들어갔는지. 정적 익스포트를 빼먹으면
          # API는 멀쩡하고 화면만 404가 되어 헬스체크로는 안 잡힌다.
          if ! curl -fs http://127.0.0.1:8000/ | grep -q "AI Research Center"; then
            echo "::error::화면이 서빙되지 않습니다 (정적 익스포트 확인)"
            docker logs arc
            exit 1
          fi
          echo "화면 서빙 확인"
